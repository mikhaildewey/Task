<!DOCTYPE html>
<html lang="en">
<head>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("KticLUmFwZgI6zrUx");
       })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Scheduler - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0F1015] h-screen flex items-center justify-center p-4 text-white font-sans relative overflow-hidden">

    <div class="bg-[#151722] border border-[#2A2D3E] p-6 md:p-8 rounded-2xl w-full max-w-md shadow-2xl z-10 transition-all">
        <div class="text-center mb-6">
            <div class="flex justify-center mb-4">
                <img src="logo.png" alt="SmartTask Logo" class="h-20 w-20 rounded-lg shadow-lg">
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight mb-1">Smart Task Scheduler</h1>
            <p class="text-xs text-gray-400">Organize your tasks smarter.</p>
        </div>

        <form class="space-y-4" onsubmit="return false;">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fa-solid fa-envelope text-sm"></i>
                    </span>
                    <input type="email" id="email" placeholder="name@example.com" class="w-full bg-[#0F1015] border border-[#2A2D3E] text-white pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-[#7B51D3] transition" required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="password" placeholder="••••••••" class="w-full bg-[#0F1015] border border-[#2A2D3E] text-white pl-10 pr-10 py-2.5 rounded-xl text-sm focus:outline-none focus:border-[#7B51D3] transition" required>
                    <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-white transition focus:outline-none">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>

                <div class="w-full bg-[#0F1015] h-1.5 rounded-full mt-2 overflow-hidden border border-[#2A2D3E]">
                    <div id="strengthBar" class="h-full w-0 transition-all duration-300 bg-red-500"></div>
                </div>
                <div id="strengthText" class="text-[10px] text-gray-500 mt-1 font-medium">Strength: Empty</div>

                <div class="mt-3 p-3 bg-[#0F1015] border border-[#2A2D3E] rounded-xl space-y-1">
                    <div id="ruleLength" class="text-[11px] text-gray-400 flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-circle text-[6px]"></i> At least 6 characters
                    </div>
                    <div id="ruleUppercase" class="text-[11px] text-gray-400 flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-circle text-[6px]"></i> Must contain an Uppercase letter
                    </div>
                    <div id="ruleSpecial" class="text-[11px] text-gray-400 flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-circle text-[6px]"></i> Must contain a Special character 
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-2 py-1">
                <input type="checkbox" id="agreeCheck" class="w-4 h-4 rounded bg-[#0F1015] border-gray-600 text-[#7B51D3] focus:ring-[#7B51D3] cursor-pointer accent-[#7B51D3]">
                <label for="agreeCheck" class="text-xs text-gray-400 select-none cursor-pointer">
                    I agree to the <a href="#" id="termsLink" class="text-[#9366F9] hover:underline font-medium">Terms & Conditions</a>
                </label>
            </div>

            <div class="pt-2 space-y-3">
                <button type="button" id="createAccBtn" class="w-full bg-[#7B51D3] hover:bg-[#6a42c0] text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-md tracking-wide">
                    Create Account
                </button>
                <button type="button" id="loginBtn" class="w-full bg-[#10B981] hover:bg-[#0e9f6e] text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-md tracking-wide">
                    Login
                </button>
            </div>
        </form>
    </div>

    <script>
        // Password logic implementation
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        
        const rules = {
            length: document.getElementById('ruleLength'),
            upper: document.getElementById('ruleUppercase'),
            special: document.getElementById('ruleSpecial')
        };

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        });

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            const hasLength = val.length >= 6;
            const hasUpper = /[A-Z]/.test(val);
            const hasSpecial = /[!@#$%^&*()-+]/.test(val);

            updateRule(rules.length, hasLength);
            updateRule(rules.upper, hasUpper);
            updateRule(rules.special, hasSpecial);

            if (val.length === 0) {
                strengthBar.style.width = "0%";
                strengthText.textContent = "Strength: Empty";
            } else if (hasSpecial) {
                strengthBar.style.width = "100%";
                strengthBar.style.backgroundColor = "#10b981";
                strengthText.textContent = "Strength: Strong"; 
            } else if (hasLength && hasUpper) {
                strengthBar.style.width = "100%";
                strengthBar.style.backgroundColor = "#10b981";
                strengthText.textContent = "Strength: Strong";
            } else {
                strengthBar.style.width = "50%";
                strengthBar.style.backgroundColor = "#f59e0b";
                strengthText.textContent = "Strength: Medium";
            }
        });

        function updateRule(element, isValid) {
            const icon = element.querySelector('i');
            if (isValid) {
                element.classList.add('text-emerald-400');
                element.classList.remove('text-gray-400');
                icon.className = 'fa-solid fa-circle-check text-[10px]';
            } else {
                element.classList.remove('text-emerald-400');
                element.classList.add('text-gray-400');
                icon.className = 'fa-solid fa-circle text-[6px]';
            }
        }
    </script>
</body>
</html>
